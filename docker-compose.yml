version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: naviar-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-naviar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret123}
      POSTGRES_DB: ${DB_NAME:-naviar_consult}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-naviar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: naviar-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-5000}
      DB_HOST: postgres
      DB_USER: ${DB_USER:-naviar}
      DB_PASSWORD: ${DB_PASSWORD:-secret123}
      DB_NAME: ${DB_NAME:-naviar_consult}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev_secret_key_change_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-30d}
      ENCRYPTION_ALGORITHM: ${ENCRYPTION_ALGORITHM:-aes-256-cbc}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
      ENCRYPTION_IV: ${ENCRYPTION_IV:-fedcba9876543210}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_test_dummy}
      CALENDLY_API_KEY: ${CALENDLY_API_KEY:-test_calendly_key}
      WHEREBY_API_KEY: ${WHEREBY_API_KEY:-test_whereby_key}
      SAP_API_KEY: ${SAP_API_KEY:-test_sap_key}
      SAP_API_USER: ${SAP_API_USER:-test_sap_user}
      VISMA_API_KEY: ${VISMA_API_KEY:-test_visma_key}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: naviar-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
